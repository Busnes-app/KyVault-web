<ng-template #loadingState>
  <div class="tw-flex tw-flex-col tw-items-center tw-justify-center tw-min-h-[100vh] tw-gap-5">
    <img class="new-logo-themed !tw-w-[168px]" alt="KyVault" />
    <i class="bwi bwi-spinner bwi-spin bwi-2x tw-text-muted" title="Loading" aria-hidden="true"></i>
  </div>
</ng-template>

<ng-container *ngIf="!loading; else loadingState">
  <router-outlet></router-outlet>
</ng-container>

<bit-toast-container></bit-toast-container>
